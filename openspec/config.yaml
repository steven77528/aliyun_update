schema: spec-driven

context: |
  项目名称：security-rule-update
  业务域：定时执行脚本，对比ip地址，更新云上ESC的安全组

  系统信息：
  - 当前系统：MacOS 26
  - 终端信息：zsh
  - 项目运行环境：linux + docker

  技术栈：
  - python 3


  目录与分层约定：
  - src: 存放业务代码，脚本

rules:
  proposal:
    - 全文使用中文。
    - 明确问题背景、目标、范围与非目标。
    - 涉及接口或数据结构变化时，列出兼容性影响与回滚思路。

  design:
    - 全文使用中文。
    - 设计需与现有分层保持一致
    - 明确事务边界、幂等策略、异常处理与日志关键字段。
    - 涉及配置新增时，给出配置项用途、默认值与环境差异。

  tasks:
    - 全文使用中文。
    - 任务拆分应可独立验证，粒度清晰，避免“实现全部逻辑”类模糊描述。
    - 每个任务应包含影响范围（模块/目录）与验收标准。
    - 涉及接口变更时，增加文档更新任务（README 或接口文档）。

  spec:
    - 全文使用中文。
    - 需求描述要可测试、可验收，避免歧义性表述。
    - 必须覆盖正常流程、异常流程与边界条件。
    - 对外行为变化要明确输入、输出与错误语义。
    - 若影响监控/运维，补充健康检查、指标或告警要求。
